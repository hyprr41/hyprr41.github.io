<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hypr | Video Editor</title>
<meta name="description" content="hypr's work. DM for commissions.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #061a52;
    --blue: #1456f0;
    --sky: #8fc0ff;
    --pale: #c9dcff;
    --ice: #eaf3ff;
    --white: #ffffff;
  }
  * { box-sizing: border-box; margin: 0; }
  html { background: var(--white); }
  body {
    min-height: 100vh;
    color: var(--navy);
    font-family: "Manrope", system-ui, sans-serif;
    line-height: 1.55;
    overflow-x: hidden;
  }
  :focus-visible { outline: 3px solid var(--navy); outline-offset: 3px; }

  /* ---------- top: deep blue, white text ---------- */
  .hero {
    background:
      radial-gradient(700px 320px at 50% 0, rgba(143,192,255,.35), transparent 70%),
      linear-gradient(180deg, var(--navy) 0%, var(--blue) 100%);
    color: var(--white);
    text-align: center;
    padding: 64px 24px 8px;
  }
  .profile { max-width: 640px; margin: 0 auto; }
  .pfp, .pfp-fallback {
    width: 128px; height: 128px;
    border-radius: 50%;
    margin: 0 auto 22px;
    display: block;
    border: 4px solid var(--white);
    box-shadow: 0 8px 30px rgba(0,0,0,.35);
  }
  .pfp { object-fit: cover; background: var(--navy); }
  .pfp-fallback {
    display: grid; place-items: center;
    background: var(--white); color: var(--blue);
    font: 700 3rem "Chakra Petch", sans-serif;
  }
  h1 {
    font: 700 clamp(2.6rem, 8vw, 3.8rem)/1 "Chakra Petch", sans-serif;
    letter-spacing: .01em;
  }
  .tagline { margin-top: 10px; font-weight: 600; color: var(--ice); }
  .bio { margin: 14px auto 0; max-width: 52ch; color: rgba(255,255,255,.85); }
  .contact {
    margin-top: 26px;
    display: inline-flex; align-items: center; gap: 12px;
    padding: 8px 8px 8px 20px;
    border-radius: 999px;
    background: var(--white);
    color: var(--navy);
    font-size: .95rem;
    box-shadow: 0 8px 24px rgba(6,26,82,.35);
  }
  .contact b { font-weight: 700; }
  .copy {
    border: 0; cursor: pointer;
    padding: 9px 18px;
    border-radius: 999px;
    background: var(--blue); color: var(--white);
    font: 600 .9rem "Manrope", sans-serif;
    transition: background .2s ease;
  }
  .copy:hover { background: var(--navy); }
  .hero h2 {
    margin-top: 56px;
    font: 600 1.5rem "Chakra Petch", sans-serif;
  }

  /* ---------- work: blue fading into white ---------- */
  .stage {
    background: linear-gradient(180deg, var(--blue) 0%, var(--sky) 42%, var(--white) 100%);
    padding: 26px 0 40px;
  }
  .viewport {
    overflow: hidden;
    padding: 14px 0 26px;
    -webkit-mask-image: linear-gradient(90deg, transparent, #000 7%, #000 93%, transparent);
            mask-image: linear-gradient(90deg, transparent, #000 7%, #000 93%, transparent);
  }
  .viewport.static { overflow-x: auto; -webkit-mask-image: none; mask-image: none; }
  .viewport.static .dup { display: none; }
  .track {
    display: flex;
    width: max-content;
    will-change: transform;
  }

  .slide {
    flex: 0 0 auto;
    width: min(420px, 78vw);
    margin-right: 22px;
    position: relative;
    aspect-ratio: 16 / 9;
    border-radius: 14px;
    overflow: hidden;
    border: 3px solid var(--white);
    background: var(--ice);
    box-shadow: 0 12px 30px rgba(6,26,82,.35);
    cursor: pointer;
    color: var(--white);
  }
  .slide img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .slide iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .play {
    position: absolute; left: 50%; top: 50%;
    width: 64px; height: 64px; margin: -32px 0 0 -32px;
    border-radius: 50%;
    background: rgba(6,26,82,.7);
    border: 2px solid var(--white);
    display: grid; place-items: center;
    transition: transform .2s ease, background .2s ease;
  }
  .play::before {
    content: ""; margin-left: 5px;
    border-left: 17px solid var(--white);
    border-top: 10px solid transparent;
    border-bottom: 10px solid transparent;
  }
  .slide:hover .play { transform: scale(1.1); background: var(--blue); }
  .cap {
    position: absolute; left: 0; right: 0; bottom: 0;
    padding: 34px 16px 12px;
    text-align: left; font-weight: 600;
    background: linear-gradient(transparent, rgba(6,26,82,.85));
  }
  .placeholder {
    position: absolute; inset: 0;
    display: grid; place-items: center;
    padding: 20px; text-align: center;
    color: var(--navy); font-weight: 500;
  }

  .resume-row { text-align: center; min-height: 44px; }
  .resume {
    display: none;
    border: 0; cursor: pointer;
    padding: 10px 22px;
    border-radius: 999px;
    background: var(--navy); color: var(--white);
    font: 600 .95rem "Manrope", sans-serif;
  }
  .resume.show { display: inline-block; }

  /* ---------- ratings ---------- */
  .ratings {
    background: var(--white);
    text-align: center;
    padding: 28px 24px 56px;
  }
  .ratings h2 { font: 600 1.5rem "Chakra Petch", sans-serif; }
  .rate-input { margin-top: 14px; display: inline-flex; }
  .star-btn {
    background: none; border: 0; padding: 4px;
    cursor: pointer; line-height: 0;
  }
  .star-btn svg {
    width: 44px; height: 44px;
    fill: var(--pale);
    transition: fill .15s ease, transform .15s ease;
  }
  .star-btn.on svg { fill: var(--blue); }
  .star-btn:hover svg { transform: scale(1.12); }
  .rate-msg { margin-top: 6px; color: #3d4f80; min-height: 1.6em; }

  .summary {
    margin: 30px auto 0;
    max-width: 340px;
    padding: 26px 24px 22px;
    border-radius: 18px;
    background: var(--ice);
    border: 1px solid var(--pale);
  }
  .summary h3 { font: 600 1rem "Manrope", sans-serif; color: #3d4f80; }
  .avg {
    margin-top: 6px;
    font: 700 3.4rem/1 "Chakra Petch", sans-serif;
    color: var(--blue);
  }
  .sd { position: relative; display: inline-flex; margin-top: 10px; }
  .sd svg { width: 30px; height: 30px; margin: 0 2px; fill: var(--pale); flex: 0 0 auto; }
  .sd-fill {
    position: absolute; left: 0; top: 0;
    display: flex; overflow: hidden; white-space: nowrap;
    width: 0;
  }
  .sd-fill svg { fill: var(--blue); }
  .count { margin-top: 8px; color: #3d4f80; font-size: .95rem; }
  .note { margin: 16px auto 0; max-width: 46ch; font-size: .85rem; color: #6a7aa5; }

  .comment-form {
    margin: 18px auto 0; max-width: 420px; text-align: left;
    display: flex; flex-direction: column; gap: 12px;
  }
  .comment-form[hidden] { display: none; }
  .field { display: flex; flex-direction: column; gap: 6px; font-size: .9rem; font-weight: 600; color: #3d4f80; }
  .field input, .field textarea {
    font: 400 1rem "Manrope", sans-serif;
    color: var(--navy);
    padding: 11px 14px;
    border: 1px solid var(--pale);
    border-radius: 12px;
    background: var(--white);
    resize: vertical;
  }
  .field input:focus, .field textarea:focus {
    outline: none; border-color: var(--blue);
    box-shadow: 0 0 0 3px rgba(20,86,240,.18);
  }
  .form-row { display: flex; justify-content: space-between; align-items: center; }
  .counter { font-size: .85rem; color: #6a7aa5; }
  .send {
    border: 0; cursor: pointer;
    padding: 11px 26px; border-radius: 999px;
    background: var(--blue); color: var(--white);
    font: 600 .95rem "Manrope", sans-serif;
    transition: background .2s ease;
  }
  .send:hover { background: var(--navy); }
  .send:disabled { opacity: .6; cursor: default; }

  .said { margin-top: 36px; font: 600 1.2rem "Chakra Petch", sans-serif; }
  .comments {
    list-style: none; padding: 0; margin: 14px auto 0;
    max-width: 520px;
    display: flex; flex-direction: column; gap: 12px;
    text-align: left;
  }
  .comments li {
    padding: 14px 18px; border-radius: 14px;
    background: var(--ice); border: 1px solid var(--pale);
  }
  .c-top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .c-top b { font-weight: 700; }
  .c-stars { color: var(--blue); letter-spacing: 2px; white-space: nowrap; }
  .comments p { margin-top: 6px; color: #2a3b6d; overflow-wrap: anywhere; }
  .no-comments { margin-top: 12px; color: #6a7aa5; }

  footer {
    text-align: center;
    padding: 0 24px 40px;
    color: var(--navy);
    opacity: .7;
    font-size: .85rem;
  }
</style>
</head>
<body>

<section class="hero">
  <div class="profile">
    <div id="pfpBox"></div>
    <h1 id="name"></h1>
    <p class="tagline" id="tagline"></p>
    <p class="bio" id="bio"></p>
    <div class="contact">
      <span id="contactText"></span>
      <button class="copy" id="copyBtn" type="button">Copy</button>
    </div>
  </div>
  <h2>Recent work</h2>
</section>

<main class="stage">
  <div class="viewport" id="viewport" aria-label="Video work">
    <div class="track" id="track"></div>
  </div>
  <div class="resume-row">
    <button class="resume" id="resume" type="button">Resume scrolling</button>
  </div>
</main>

<section class="ratings" aria-labelledby="rateTitle">
  <h2 id="rateTitle">Rate my work</h2>
  <div class="rate-input" id="stars" role="group" aria-label="Your rating"></div>
  <p class="rate-msg" id="rateMsg">Tap a star to leave a rating</p>

  <div class="comment-form" id="form" hidden>
    <label class="field"><span>Name (optional)</span>
      <input id="cName" type="text" maxlength="40" autocomplete="nickname">
    </label>
    <label class="field"><span>Comment (optional)</span>
      <textarea id="cText" rows="3" maxlength="300"></textarea>
    </label>
    <div class="form-row">
      <span class="counter" id="cCount">0 / 300</span>
      <button class="send" id="send" type="button">Submit</button>
    </div>
  </div>

  <div class="summary">
    <h3>What people have rated</h3>
    <div class="avg" id="avg">-</div>
    <div class="sd" aria-hidden="true">
      <div id="sdBase"></div>
      <div class="sd-fill" id="sdFill"></div>
    </div>
    <p class="count" id="count">Loading ratings...</p>
  </div>

  <h3 class="said">What people said</h3>
  <ul class="comments" id="comments"></ul>
  <p class="no-comments" id="noComments" hidden>No comments yet.</p>
  <p class="note" id="note" hidden></p>
</section>

<footer id="foot"></footer>

<script type="module">
/* =========================================================
   EDIT THIS PART. Everything else can stay as it is.
   ========================================================= */
const CONFIG = {
  name: "hypr",
  tagline: "Video Editor",                        // change to whatever you do
  bio: "YouTube videos, Shorts, TikToks and more. I've been editing for 3+ years, creating clean, smooth and engaging edits in any style. Take a look at my recent work below!",
  discord: "hypr.7",                              // shown on the contact button
  pfp: "pfp.png",                                 // upload this image to your repo

  // Paste your YouTube links here. Add or remove lines as you like.
  // "title" is optional.
  videos: [
    { url: "PASTE_YOUTUBE_LINK_1", title: "Project one" },
    { url: "PASTE_YOUTUBE_LINK_2", title: "Project two" },
    { url: "PASTE_YOUTUBE_LINK_3", title: "Project three" }
  ],

  speed: 35,                                      // scroll speed in pixels per second (lower = slower)
  respectReducedMotion: false,                    // true = stop auto scroll for people who turned animations off

  // Ratings from visitors need a free Firebase database.
  // Leave these empty until you set it up. The stars still work, but only on your own browser.
  firebase: {
    apiKey: "",
    projectId: "",
    appId: ""
  }
};
/* ========================================================= */

const $ = (id) => document.getElementById(id);

/* ---------- profile ---------- */
$("name").textContent = CONFIG.name;
$("tagline").textContent = CONFIG.tagline;
$("bio").textContent = CONFIG.bio;
$("contactText").innerHTML = "DM for commissions: <b></b>";
$("contactText").querySelector("b").textContent = CONFIG.discord;
$("foot").textContent = "\u00A9 " + new Date().getFullYear() + " " + CONFIG.name;
document.title = CONFIG.name + " | " + CONFIG.tagline;

const img = new Image();
img.className = "pfp";
img.alt = CONFIG.name + " profile picture";
img.onload = () => $("pfpBox").appendChild(img);
img.onerror = () => {
  const f = document.createElement("div");
  f.className = "pfp-fallback";
  f.textContent = CONFIG.name.charAt(0).toUpperCase();
  $("pfpBox").appendChild(f);
};
img.src = CONFIG.pfp;

$("copyBtn").addEventListener("click", async () => {
  try {
    await navigator.clipboard.writeText(CONFIG.discord);
    $("copyBtn").textContent = "Copied";
  } catch (e) {
    $("copyBtn").textContent = "Copy failed";
  }
  setTimeout(() => ($("copyBtn").textContent = "Copy"), 1600);
});

/* ---------- scrolling videos ---------- */
function videoId(input) {
  if (!input) return null;
  const m = String(input).match(
    /(?:youtu\.be\/|youtube\.com\/(?:watch\?(?:.*&)?v=|shorts\/|embed\/|live\/))([\w-]{11})/
  );
  if (m) return m[1];
  return /^[\w-]{11}$/.test(input) ? input : null;
}

const items = CONFIG.videos
  .map((v) => ({ id: videoId(v.url), title: v.title || "" }))
  .filter((v) => v.id);

const base = items.length ? items : [null, null, null, null];
const track = $("track");
const viewport = $("viewport");
const resumeBtn = $("resume");

/* repeat the set so one half is always wider than the screen */
const repeats = Math.max(1, Math.ceil(2400 / (base.length * 442)));
const unit = [];
for (let r = 0; r < repeats; r++) base.forEach((b) => unit.push(b));

function showThumb(s) {
  const item = s._item;
  delete s.dataset.playing;
  s.innerHTML =
    '<img alt="" loading="lazy" src="https://img.youtube.com/vi/' + item.id + '/hqdefault.jpg">' +
    '<span class="play"></span>' +
    (item.title ? '<div class="cap"></div>' : "");
  if (item.title) s.querySelector(".cap").textContent = item.title;
}

function stopAll() {
  track.querySelectorAll(".slide[data-playing]").forEach(showThumb);
  track.classList.remove("hold");
  resumeBtn.classList.remove("show");
}

function play(s) {
  stopAll();
  const f = document.createElement("iframe");
  f.src = "https://www.youtube-nocookie.com/embed/" + s._item.id + "?autoplay=1&rel=0";
  f.title = s._item.title || "YouTube video";
  f.allow = "autoplay; encrypted-media; picture-in-picture; fullscreen";
  f.allowFullscreen = true;
  s.innerHTML = "";
  s.appendChild(f);
  s.dataset.playing = "1";
  track.classList.add("hold");
  resumeBtn.classList.add("show");
}

function makeSlide(item, isDup) {
  const s = document.createElement("div");
  s.className = "slide" + (isDup ? " dup" : "");
  if (isDup) s.setAttribute("aria-hidden", "true");
  if (item) {
    s._item = item;
    showThumb(s);
    s.tabIndex = isDup ? -1 : 0;
    s.addEventListener("click", () => { if (!s.dataset.playing) play(s); });
    s.addEventListener("keydown", (e) => {
      if ((e.key === "Enter" || e.key === " ") && !s.dataset.playing) { e.preventDefault(); play(s); }
    });
  } else {
    s.innerHTML = '<div class="placeholder">Add your YouTube links in the CONFIG section of index.html</div>';
  }
  return s;
}

[false, true].forEach((isDup) => unit.forEach((item) => track.appendChild(makeSlide(item, isDup))));
resumeBtn.addEventListener("click", stopAll);

/* auto scroll: moves the strip left a little every frame */
const reduce = CONFIG.respectReducedMotion &&
  window.matchMedia("(prefers-reduced-motion: reduce)").matches;

if (reduce) {
  viewport.classList.add("static");
} else {
  let offset = 0;
  let last = null;
  let hovering = false;
  let touchTimer = null;

  viewport.addEventListener("mouseenter", () => { hovering = true; });
  viewport.addEventListener("mouseleave", () => { hovering = false; });
  viewport.addEventListener("touchstart", () => {
    hovering = true;
    clearTimeout(touchTimer);
  }, { passive: true });
  viewport.addEventListener("touchend", () => {
    touchTimer = setTimeout(() => { hovering = false; }, 1500);
  });

  function frame(t) {
    if (last === null) last = t;
    const dt = Math.min((t - last) / 1000, 0.1);
    last = t;
    if (!hovering && !track.classList.contains("hold")) {
      const half = track.scrollWidth / 2;
      offset += CONFIG.speed * dt;
      if (half > 0 && offset >= half) offset -= half;
      track.style.transform = "translate3d(" + (-offset) + "px,0,0)";
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

/* ---------- ratings and comments ---------- */
const STAR = '<svg viewBox="0 0 24 24"><polygon points="12,2 15.1,8.6 22,9.3 16.8,14 18.2,21 12,17.5 5.8,21 7.2,14 2,9.3 8.9,8.6"/></svg>';
const starsBox = $("stars");
const msg = $("rateMsg");
const form = $("form");
const nameIn = $("cName");
const textIn = $("cText");
const sendBtn = $("send");
let picked = 0;
let hoverN = 0;
let saved = null;

const btns = [];
for (let n = 1; n <= 5; n++) {
  const b = document.createElement("button");
  b.type = "button";
  b.className = "star-btn";
  b.innerHTML = STAR;
  b.setAttribute("aria-label", "Rate " + n + (n === 1 ? " star" : " stars"));
  b.addEventListener("mouseenter", () => { hoverN = n; paintInput(); });
  b.addEventListener("mouseleave", () => { hoverN = 0; paintInput(); });
  b.addEventListener("click", () => {
    picked = n;
    paintInput();
    form.hidden = false;
    msg.textContent = n + (n === 1 ? " star" : " stars") + " selected. Add a comment if you like, then submit.";
    sendBtn.textContent = saved ? "Update" : "Submit";
  });
  starsBox.appendChild(b);
  btns.push(b);
}

function paintInput() {
  const shown = hoverN || picked;
  btns.forEach((b, i) => b.classList.toggle("on", i < shown));
}

textIn.addEventListener("input", () => {
  $("cCount").textContent = textIn.value.length + " / 300";
});

$("sdBase").style.display = "flex";
$("sdBase").innerHTML = STAR.repeat(5);
$("sdFill").innerHTML = STAR.repeat(5);

function paintSummary(avg, n, demo) {
  if (!n) {
    $("avg").textContent = "-";
    $("sdFill").style.width = "0%";
    $("count").textContent = "No ratings yet. Be the first!";
    return;
  }
  $("avg").textContent = avg.toFixed(1);
  $("sdFill").style.width = (avg / 5 * 100) + "%";
  $("count").textContent = "Based on " + n + (n === 1 ? " rating" : " ratings") + (demo ? " (demo)" : "");
}

function paintComments(list) {
  const ul = $("comments");
  ul.innerHTML = "";
  $("noComments").hidden = list.length > 0;
  list.forEach((c) => {
    const li = document.createElement("li");
    const top = document.createElement("div");
    top.className = "c-top";
    const who = document.createElement("b");
    who.textContent = c.name || "Anonymous";
    const st = document.createElement("span");
    st.className = "c-stars";
    st.setAttribute("aria-label", c.stars + " out of 5 stars");
    st.textContent = "\u2605".repeat(c.stars) + "\u2606".repeat(5 - c.stars);
    top.appendChild(who);
    top.appendChild(st);
    const p = document.createElement("p");
    p.textContent = c.comment;
    li.appendChild(top);
    li.appendChild(p);
    ul.appendChild(li);
  });
}

/* a random id for this visitor, so one person has one rating */
function visitorId() {
  try {
    let id = localStorage.getItem("hypr_vid");
    if (!id) {
      id = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(16).slice(2));
      localStorage.setItem("hypr_vid", id);
    }
    return id;
  } catch (e) {
    return "v" + Date.now() + Math.random().toString(16).slice(2);
  }
}
const vid = visitorId();

const fb = CONFIG.firebase || {};
const online = !!(fb.apiKey && fb.projectId && fb.appId);
let backend = null;

async function setupBackend() {
  const v = "10.12.2";
  const appMod = await import("https://www.gstatic.com/firebasejs/" + v + "/firebase-app.js");
  const fsMod = await import("https://www.gstatic.com/firebasejs/" + v + "/firebase-firestore.js");
  const app = appMod.initializeApp(fb);
  const db = fsMod.getFirestore(app);
  const col = fsMod.collection(db, "ratings");
  return {
    async save(r) {
      await fsMod.setDoc(fsMod.doc(db, "ratings", vid), {
        stars: r.stars, name: r.name, comment: r.comment, at: fsMod.serverTimestamp()
      });
    },
    async getMine() {
      const d = await fsMod.getDoc(fsMod.doc(db, "ratings", vid));
      if (!d.exists()) return null;
      const x = d.data();
      return { stars: x.stars, name: x.name || "", comment: x.comment || "" };
    },
    async summary() {
      const snap = await fsMod.getAggregateFromServer(col, {
        n: fsMod.count(),
        avg: fsMod.average("stars")
      });
      const d = snap.data();
      return { n: d.n, avg: d.avg || 0 };
    },
    async comments() {
      const q = fsMod.query(col, fsMod.orderBy("at", "desc"), fsMod.limit(40));
      const snap = await fsMod.getDocs(q);
      const out = [];
      snap.forEach((d) => {
        const x = d.data();
        if (x.comment && String(x.comment).trim()) {
          out.push({ stars: x.stars, name: x.name || "", comment: String(x.comment) });
        }
      });
      return out.slice(0, 12);
    }
  };
}

function localMine() {
  try { return JSON.parse(localStorage.getItem("hypr_rating_v2")) || null; } catch (e) { return null; }
}

async function refresh() {
  try {
    if (backend) {
      const s = await backend.summary();
      paintSummary(s.avg, s.n, false);
      paintComments(await backend.comments());
    } else {
      const m = localMine();
      paintSummary(m ? m.stars : 0, m ? 1 : 0, true);
      paintComments(m && m.comment ? [m] : []);
    }
  } catch (e) {
    $("count").textContent = "Couldn't load ratings right now.";
  }
}

async function submit() {
  if (!picked) return;
  const r = {
    stars: picked,
    name: nameIn.value.trim().slice(0, 40),
    comment: textIn.value.trim().slice(0, 300)
  };
  sendBtn.disabled = true;
  msg.textContent = "Saving...";
  try {
    if (backend) {
      await backend.save(r);
    } else {
      try { localStorage.setItem("hypr_rating_v2", JSON.stringify(r)); } catch (e) {}
    }
    msg.textContent = (saved ? "Updated! " : "Thanks! ") + "You gave " + r.stars + (r.stars === 1 ? " star." : " stars.");
    saved = r;
    sendBtn.textContent = "Update";
    await refresh();
  } catch (e) {
    msg.textContent = "Couldn't save that. Try again in a moment.";
  }
  sendBtn.disabled = false;
}
sendBtn.addEventListener("click", submit);

function loadMine(m) {
  if (!m || !m.stars) return;
  saved = m;
  picked = m.stars;
  nameIn.value = m.name || "";
  textIn.value = m.comment || "";
  $("cCount").textContent = textIn.value.length + " / 300";
  form.hidden = false;
  sendBtn.textContent = "Update";
  msg.textContent = "You gave " + m.stars + (m.stars === 1 ? " star." : " stars.") + " Tap a star to change it.";
  paintInput();
}

(async function initRatings() {
  if (!online) {
    const note = $("note");
    note.hidden = false;
    note.textContent = "Demo mode: ratings and comments are saved only in this browser. Add your Firebase details in CONFIG to collect them from everyone.";
    loadMine(localMine());
    await refresh();
    return;
  }
  try {
    backend = await setupBackend();
    loadMine(await backend.getMine());
  } catch (e) {
    backend = null;
  }
  await refresh();
})();
</script>
</body>
</html>
