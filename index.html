  * { box-sizing: border-box; margin: 0; }
  html { background: var(--white); }
  body {
    min-height: 100vh;
    color: var(--navy);
    font-family: "Manrope", system-ui, sans-serif;
    line-height: 1.55;
    overflow-x: hidden;
  }
  :focus-visible { outline: 3px solid var(--navy); outline-offset: 3px; }
  [hidden] { display: none !important; }

  /* ---------- page wrapper + sliding logos ---------- */
  .top { position: relative; overflow: hidden; }
  .logos {
    position: absolute; left: 0; right: 0;
    top: calc(var(--th) * -1); bottom: 0;
    background: rgba(255,255,255,.17);
    -webkit-mask-image: var(--logo-tile);
            mask-image: var(--logo-tile);
    -webkit-mask-size: var(--tw) var(--th);
            mask-size: var(--tw) var(--th);
    -webkit-mask-repeat: repeat;
            mask-repeat: repeat;
    animation: fall var(--slide, 45s) linear infinite;
    will-change: transform;
    pointer-events: none;
    z-index: 0;
  }
  @keyframes fall { to { transform: translateY(var(--th)); } }
  .calm .logos { animation: none; }
  .hero > *, .stage > * { position: relative; z-index: 1; }

  /* ---------- top: deep blue, white text ---------- */
  .hero {
    background:
      radial-gradient(700px 320px at 50% 0, rgba(143,192,255,.35), transparent 70%),
      linear-gradient(180deg, var(--navy) 0%, var(--blue) 100%);
    color: var(--white);
    text-align: center;
    padding: 64px 24px 8px;
  }
  .profile { max-width: 640px; margin: 0 auto; }
  .pfp, .pfp-fallback {
    width: 128px; height: 128px;
    border-radius: 50%;
    margin: 0 auto 22px;
    display: block;
    border: 4px solid var(--white);
    box-shadow: 0 8px 30px rgba(0,0,0,.35);
  }
  .pfp { object-fit: cover; background: var(--navy); }
  .pfp-fallback {
    display: grid; place-items: center;
    background: var(--white); color: var(--blue);
    font: 700 3rem "Chakra Petch", sans-serif;
  }
  h1 {
    font: 700 clamp(2.6rem, 8vw, 3.8rem)/1 "Chakra Petch", sans-serif;
    letter-spacing: .01em;
  }
  .tagline { margin-top: 10px; font-weight: 600; color: var(--ice); }
  .bio { margin: 14px auto 0; max-width: 52ch; color: rgba(255,255,255,.85); }
  .status {
    display: inline-block;
    margin-top: 22px;
    padding: 7px 18px;
    border-radius: 999px;
    background: rgba(255,255,255,.14);
    border: 1px solid rgba(255,255,255,.35);
    font-weight: 600;
    font-size: .95rem;
  }
  .contact {
    margin-top: 14px;
    display: inline-flex; align-items: center; gap: 12px;
    padding: 8px 8px 8px 20px;
    border-radius: 999px;
    background: var(--white);
    color: var(--navy);
    font-size: .95rem;
    box-shadow: 0 8px 24px rgba(6,26,82,.35);
  }
  .contact b { font-weight: 700; }
  .copy {
    border: 0; cursor: pointer;
    padding: 9px 18px;
    border-radius: 999px;
    background: var(--blue); color: var(--white);
    font: 600 .9rem "Manrope", sans-serif;
    transition: background .2s ease;
  }
  .copy:hover { background: var(--navy); }
  .socials {
    margin-top: 18px;
    display: flex; flex-wrap: wrap; justify-content: center; gap: 10px;
  }
  .chip {
    display: inline-block;
    padding: 9px 20px;
    border-radius: 999px;
    background: rgba(255,255,255,.14);
    border: 1px solid rgba(255,255,255,.4);
    color: var(--white);
    font: 600 .92rem "Manrope", sans-serif;
    text-decoration: none;
    cursor: pointer;
    transition: background .2s ease, color .2s ease, transform .2s ease;
  }
  .chip:hover { background: var(--white); color: var(--blue); transform: translateY(-2px); }
  .chip.solid { background: var(--blue); border-color: var(--blue); }
  .chip.solid:hover { background: var(--navy); border-color: var(--navy); color: var(--white); }
  .hero h2 {
    margin-top: 56px;
    font: 600 1.5rem "Chakra Petch", sans-serif;
  }

  /* ---------- blue fading into white ---------- */
  .stage {
    background: linear-gradient(180deg, var(--blue) 0%, var(--sky) 42%, var(--white) 100%);
    padding: 26px 0 70px;
  }

  /* ---------- home: style boxes ---------- */
  .grid {
    max-width: 960px;
    margin: 0 auto;
    padding: 0 20px;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 24px;
  }
  .card {
    display: block;
    border-radius: 22px;
    overflow: hidden;
    background: var(--white);
    border: 3px solid var(--white);
    box-shadow: 0 14px 34px rgba(6,26,82,.32);
    color: var(--navy);
    text-decoration: none;
    transition: transform .25s ease, box-shadow .25s ease;
  }
  .card:hover { transform: translateY(-6px); box-shadow: 0 20px 40px rgba(6,26,82,.42); }
  .cimg {
    aspect-ratio: 1200 / 735;
    overflow: hidden;
    background: var(--navy);
  }
  .cimg img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .5s ease; }
  .card:hover .cimg img { transform: scale(1.05); }
  .ph {
    width: 100%; height: 100%;
    display: grid; place-content: center; gap: 6px;
    padding: 20px; text-align: center;
    background: linear-gradient(135deg, var(--blue), var(--navy));
    color: var(--white);
  }
  .ph b { font: 700 1.6rem/1.15 "Chakra Petch", sans-serif; }
  .ph span { color: var(--pale); font-weight: 500; }
  .cbar {
    display: flex; justify-content: space-between; align-items: center; gap: 12px;
    padding: 14px 18px;
  }
  .cbar b { font: 600 1.05rem "Chakra Petch", sans-serif; }
  .cbar span { color: var(--blue); font-weight: 700; white-space: nowrap; }

  /* ---------- style page ---------- */
  .hero.small { padding-top: 36px; padding-bottom: 28px; }
  .style-head { max-width: 760px; margin: 0 auto; }
  .back {
    display: inline-flex; align-items: center; gap: 10px;
    padding: 8px 18px 8px 8px;
    border-radius: 999px;
    background: rgba(255,255,255,.14);
    border: 1px solid rgba(255,255,255,.4);
    color: var(--white); text-decoration: none;
    font-weight: 600; font-size: .95rem;
    transition: background .2s ease, color .2s ease;
  }
  .back i {
    width: 34px; height: 34px; border-radius: 50%;
    display: grid; place-items: center;
    background: var(--white); color: var(--blue);
    font-style: normal; font-size: 1.2rem; font-weight: 700;
  }
  .back:hover { background: var(--white); color: var(--blue); }
  .back:hover i { background: var(--blue); color: var(--white); }
  .hero.small h1 { margin-top: 26px; font-size: clamp(2rem, 6vw, 3rem); line-height: 1.1; }
  .hero.small .bio { margin-top: 12px; }

  .panels {
    max-width: 960px; margin: 0 auto; padding: 0 20px;
    display: grid; gap: 24px;
  }
  .panel {
    background: var(--white);
    border-radius: 22px;
    padding: 26px;
    box-shadow: 0 14px 34px rgba(6,26,82,.22);
    border: 1px solid var(--pale);
  }
  .panel h2 { font: 600 1.4rem "Chakra Petch", sans-serif; margin-bottom: 16px; }
  .panel p.sub { color: #3d4f80; margin-bottom: 16px; }

  .vids { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
  .vid {
    position: relative;
    aspect-ratio: 16 / 9;
    border-radius: 14px;
    overflow: hidden;
    border: 2px solid var(--pale);
    background: var(--ice);
    cursor: pointer;
    color: var(--white);
  }
  .vid.big { border-radius: 16px; }
  .vid img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .vid iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .play {
    position: absolute; left: 50%; top: 50%;
    width: 64px; height: 64px; margin: -32px 0 0 -32px;
    border-radius: 50%;
    background: rgba(6,26,82,.7);
    border: 2px solid var(--white);
    transition: transform .2s ease, background .2s ease;
  }
  .play::before {
    content: ""; position: absolute; left: 50%; top: 50%;
    margin: -10px 0 0 -6px;
    border-left: 17px solid var(--white);
    border-top: 10px solid transparent;
    border-bottom: 10px solid transparent;
  }
  .vid:hover .play { transform: scale(1.1); background: var(--blue); }
  .cap {
    position: absolute; left: 0; right: 0; bottom: 0;
    padding: 34px 16px 12px;
    text-align: left; font-weight: 600;
    background: linear-gradient(transparent, rgba(6,26,82,.85));
  }

  .prices { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 16px; }
  .price {
    padding: 20px;
    border-radius: 16px;
    background: var(--ice);
    border: 1px solid var(--pale);
  }
  .price h3 { font: 600 1.05rem "Manrope", sans-serif; }
  .price .amt { margin: 6px 0; font: 700 2.2rem/1.1 "Chakra Petch", sans-serif; color: var(--blue); }
  .price p { color: #3d4f80; font-size: .92rem; }
  .order { text-align: center; }
  .order .socials { margin-top: 6px; }
  .soon { text-align: center; color: #3d4f80; padding: 20px 0; }

  footer {
    text-align: center;
    padding: 0 24px 40px;
    color: var(--navy);
    opacity: .7;
    font-size: .85rem;
  }

  @media (max-width: 640px) {
    .grid { grid-template-columns: 1fr; }
    .panel { padding: 20px; }
  }
</style>
</head>
<body>

<div class="top">
  <div class="logos" id="logos" aria-hidden="true"></div>

  <!-- ===== HOME ===== -->
  <div id="home">
    <section class="hero">
      <div class="profile">
        <div id="pfpBox"></div>
        <h1 id="name"></h1>
        <p class="tagline" id="tagline"></p>
        <p class="bio" id="bio"></p>
        <div class="status" id="status"></div><br>
        <div class="contact">
          <span id="contactText"></span>
          <button class="copy" id="copyBtn" type="button">Copy</button>
        </div>
        <div class="socials" id="socials"></div>
      </div>
      <h2>Choose an editing style</h2>
    </section>
    <main class="stage">
      <div class="grid" id="grid"></div>
    </main>
  </div>

  <!-- ===== ONE EDITING STYLE ===== -->
  <div id="stylePage" hidden>
    <section class="hero small">
      <div class="style-head">
        <a class="back" href="#"><i>&larr;</i> All styles</a>
        <h1 id="sTitle"></h1>
        <p class="bio" id="sBlurb"></p>
      </div>
    </section>
    <main class="stage">
      <div class="panels" id="panels"></div>
    </main>
  </div>
</div>

<footer id="foot"></footer>

<script>
/* =========================================================
   EDIT THIS PART. Everything else can stay as it is.
   ========================================================= */
const CONFIG = {
  name: "hypr",
  tagline: "Video Editor",
  bio: "YouTube videos, Shorts, TikToks and more. I've been editing for 3+ years, creating clean, smooth and engaging edits in any style. Take a look at my recent work below!",
  discord: "hypr.7",                              // shown on the contact button
  pfp: "pfp.png",                                 // your profile picture file in the repo

  commissions: "open",                            // "open" shows a green dot, "closed" shows a red dot

  // Social buttons. Give a link with "url", or use "copy" to copy text.
  socials: [
    { name: "Discord", url: "https://discord.gg/a232rmvVCz" },
    { name: "guns.lol", url: "https://guns.lol/hyprr8" }
  ],

  logoSlideSeconds: 45,                           // how fast the YouTube logos slide down (higher = slower)
  respectReducedMotion: false,                    // true = stop the sliding logos for people who turned animations off

  /* The editing style boxes on the home page. Each one opens its own page.
     id        : used in the link (keep it short, no spaces)
     image     : picture file for the box (upload it to your repo). Leave "" for a plain blue box
     showreel  : one big video at the top of the page (or null)
     works     : your recent work in this style (add as many as you like)
     prices    : your price list for this style                                              */
  styles: [
    {
      id: "gtag",
      title: "Gorilla Tag editing style",
      image: "gtag.jpg",
      blurb: "Fast, clean Gorilla Tag edits. Check out my showreel, recent work and prices below.",
      showreel: { url: "https://youtu.be/_abKATi9mWo", title: "Showreel" },
      works: [
        { url: "" }
      ],
      prices: [
        { name: "Short edit",    price: "$5", note: "Fully editied short 0-60 seconds." },
        { name: "Full video",    price: "$XX", note: "Change this text to describe what is included." }
      ]
    },
    { id: "style2", title: "Editing style 2", image: "", blurb: "Coming soon.", showreel: null, works: [], prices: [] },
    { id: "style3", title: "Editing style 3", image: "", blurb: "Coming soon.", showreel: null, works: [], prices: [] },
    { id: "style4", title: "Editing style 4", image: "", blurb: "Coming soon.", showreel: null, works: [], prices: [] }
  ]
};
/* ========================================================= */

const $ = (id) => document.getElementById(id);
function make(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

/* ---------- profile ---------- */
$("name").textContent = CONFIG.name;
$("tagline").textContent = CONFIG.tagline;
$("bio").textContent = CONFIG.bio;
const isOpen = CONFIG.commissions !== "closed";
$("status").textContent = isOpen ? "\uD83D\uDFE2 Commissions open" : "\uD83D\uDD34 Commissions closed";
$("contactText").innerHTML = (isOpen ? "DM for commissions: " : "Contact: ") + "<b></b>";
$("contactText").querySelector("b").textContent = CONFIG.discord;
$("foot").textContent = "\u00A9 " + new Date().getFullYear() + " " + CONFIG.name;

const img = new Image();
img.className = "pfp";
img.alt = CONFIG.name + " profile picture";
img.onload = () => $("pfpBox").appendChild(img);
img.onerror = () => {
  const f = make("div", "pfp-fallback", CONFIG.name.charAt(0).toUpperCase());
  $("pfpBox").appendChild(f);
};
img.src = CONFIG.pfp;

$("copyBtn").addEventListener("click", async () => {
  try {
    await navigator.clipboard.writeText(CONFIG.discord);
    $("copyBtn").textContent = "Copied";
  } catch (e) {
    $("copyBtn").textContent = "Copy failed";
  }
  setTimeout(() => ($("copyBtn").textContent = "Copy"), 1600);
});

/* ---------- social buttons ---------- */
function buildSocials(box, solid) {
  (CONFIG.socials || []).forEach((so) => {
    if (!so.url && !so.copy) return;
    if (so.url && so.url.indexOf("YOUR_") !== -1) return;   // hide until you add your real link
    let el;
    if (so.url) {
      el = document.createElement("a");
      el.href = so.url;
      el.target = "_blank";
      el.rel = "noopener noreferrer";
    } else {
      el = document.createElement("button");
      el.type = "button";
      el.addEventListener("click", async () => {
        try { await navigator.clipboard.writeText(so.copy); el.textContent = "Copied " + so.copy; }
        catch (e) { el.textContent = so.copy; }
        setTimeout(() => { el.textContent = so.name; }, 1800);
      });
    }
    el.className = "chip" + (solid ? " solid" : "");
    el.textContent = so.name;
    box.appendChild(el);
  });
}
buildSocials($("socials"), false);

/* ---------- sliding logo background ---------- */
$("logos").style.setProperty("--slide", CONFIG.logoSlideSeconds + "s");
if (CONFIG.respectReducedMotion && window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
  document.body.classList.add("calm");
}

/* ---------- home: the style boxes ---------- */
CONFIG.styles.forEach((st) => {
  const a = make("a", "card");
  a.href = "#" + st.id;
  a.setAttribute("aria-label", st.title);

  const box = make("div", "cimg");
  function placeholder() {
    box.innerHTML = "";
    const ph = make("div", "ph");
    ph.appendChild(make("b", "", st.title));
    ph.appendChild(make("span", "", st.showreel || (st.works && st.works.length) ? "" : "Coming soon"));
    box.appendChild(ph);
  }
  if (st.image) {
    const im = new Image();
    im.alt = "";
    im.onerror = placeholder;
    im.src = st.image;
    box.appendChild(im);
  } else {
    placeholder();
  }
  a.appendChild(box);

  const bar = make("div", "cbar");
  bar.appendChild(make("b", "", st.title));
  const go = make("span");
  go.innerHTML = "View work &rarr;";
  bar.appendChild(go);
  a.appendChild(bar);
  $("grid").appendChild(a);
});

/* ---------- videos ---------- */
function videoId(input) {
  if (!input) return null;
  const m = String(input).match(
    /(?:youtu\.be\/|youtube\.com\/(?:watch\?(?:.*&)?v=|shorts\/|embed\/|live\/))([\w-]{11})/
  );
  if (m) return m[1];
  return /^[\w-]{11}$/.test(input) ? input : null;
}

function makeVideo(item, big) {
  const id = videoId(item.url);
  if (!id) return null;
  const v = make("div", "vid" + (big ? " big" : ""));
  v.tabIndex = 0;
  v.setAttribute("role", "button");
  v.setAttribute("aria-label", "Play " + (item.title || "video"));
  v.innerHTML =
    '<img alt="" loading="lazy" src="https://img.youtube.com/vi/' + id + '/hqdefault.jpg">' +
    '<span class="play"></span>' +
    (item.title ? '<div class="cap"></div>' : "");
  if (item.title) v.querySelector(".cap").textContent = item.title;
  const start = () => {
    const f = document.createElement("iframe");
    f.src = "https://www.youtube-nocookie.com/embed/" + id + "?autoplay=1&rel=0";
    f.title = item.title || "YouTube video";
    f.allow = "autoplay; encrypted-media; picture-in-picture; fullscreen";
    f.allowFullscreen = true;
    v.innerHTML = "";
    v.appendChild(f);
    v.onclick = null;
    v.removeAttribute("role");
  };
  v.addEventListener("click", start, { once: true });
  v.addEventListener("keydown", (e) => {
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); start(); }
  });
  return v;
}

/* ---------- one style page ---------- */
function panel(title) {
  const p = make("section", "panel");
  if (title) p.appendChild(make("h2", "", title));
  return p;
}

function showStyle(st) {
  $("home").hidden = true;
  $("stylePage").hidden = false;
  $("sTitle").textContent = st.title;
  $("sBlurb").textContent = st.blurb || "";
  document.title = st.title + " | " + CONFIG.name;

  const box = $("panels");
  box.innerHTML = "";
  let anything = false;

  const reel = st.showreel && makeVideo(st.showreel, true);
  if (reel) {
    const p = panel("Showreel");
    p.appendChild(reel);
    box.appendChild(p);
    anything = true;
  }

  const works = (st.works || []).map((w) => makeVideo(w, false)).filter(Boolean);
  if (works.length) {
    const p = panel("Recent work");
    const g = make("div", "vids");
    works.forEach((w) => g.appendChild(w));
    p.appendChild(g);
    box.appendChild(p);
    anything = true;
  }

  if (st.prices && st.prices.length) {
    const p = panel("Prices");
    const g = make("div", "prices");
    st.prices.forEach((pr) => {
      const c = make("div", "price");
      c.appendChild(make("h3", "", pr.name || ""));
      c.appendChild(make("div", "amt", pr.price || ""));
      if (pr.note) c.appendChild(make("p", "", pr.note));
      g.appendChild(c);
    });
    p.appendChild(g);
    box.appendChild(p);
    anything = true;
  }

  if (!anything) {
    const p = panel("");
    p.appendChild(make("p", "soon", "Work for this style is coming soon. Check back later!"));
    box.appendChild(p);
  }

  const order = panel("Want an edit like this?");
  order.classList.add("order");
  order.appendChild(make("p", "sub", "DM me " + CONFIG.discord + " on Discord, or reach me here:"));
  const row = make("div", "socials");
  buildSocials(row, true);
  order.appendChild(row);
  box.appendChild(order);
}

function showHome() {
  $("stylePage").hidden = true;
  $("panels").innerHTML = "";          // also stops any playing video
  $("home").hidden = false;
  document.title = CONFIG.name + " | " + CONFIG.tagline;
}

function route() {
  const id = decodeURIComponent(location.hash.replace(/^#\/?/, ""));
  const st = CONFIG.styles.find((s) => s.id === id);
  if (st) showStyle(st); else showHome();
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", route);
route();
</script>
</body>
</html>
