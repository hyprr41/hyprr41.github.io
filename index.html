<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hypr | Video Editor</title>
<meta name="description" content="hypr's video editing work. DM for commissions.">
<meta name="theme-color" content="#060912">
<meta property="og:type" content="website">
<meta property="og:title" content="hypr | Video Editor">
<meta property="og:description" content="YouTube videos, Shorts, TikToks and more. 4+ years editing. DM for commissions.">
<meta property="og:image" content="pfp.png">
<meta name="twitter:card" content="summary">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Chakra+Petch:wght@600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   TOKENS + BASE
   ===================================================================== */
:root {
  --bg: #060912; --bg2: #0b1226; --panel: #0f1730; --panel2: #141e3c;
  --line: rgba(120,160,255,.18); --text: #e9eeff; --mute: #9aa8cf;
  --accent: #4d8dff; --accent2: #2f6bff; --glow: rgba(77,141,255,.38); --gold: #ffc94d;
  --ease: cubic-bezier(.22,1,.36,1); --spring: cubic-bezier(.34,1.56,.64,1);
  --r-lg: 22px; --r-md: 16px;
  --display: "Chakra Petch", system-ui, sans-serif;
  --body: "Manrope", system-ui, sans-serif;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; }
html { background: var(--bg); scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
body {
  min-height: 100vh; padding-top: 76px;
  background: var(--bg); color: var(--text);
  font-family: var(--body); line-height: 1.6;
  overflow-x: hidden; -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; }
a { color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
::selection { background: var(--accent2); color: #fff; }

/* =====================================================================
   BACKGROUND (fixed layer: sliding logos + soft colour clouds)
   ===================================================================== */
.bg { position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: 0; contain: strict; }
.bg-par { position: absolute; inset: -40px; will-change: translate; }
.logos {
  position: absolute; left: 0; right: 0; top: -720px; bottom: 0;
  background-repeat: repeat; background-size: 480px 720px;
  animation: fall var(--slide, 45s) linear infinite;
  will-change: transform;
}
@keyframes fall { to { transform: translate3d(0, 720px, 0); } }
.orb { position: absolute; border-radius: 50%; will-change: transform; }
.o1 { width: 620px; height: 620px; left: 6%;  top: -160px; background: radial-gradient(circle, rgba(77,141,255,.30), transparent 66%); animation: d1 18s ease-in-out infinite alternate; }
.o2 { width: 540px; height: 540px; right: 2%; top: 120px;  background: radial-gradient(circle, rgba(56,189,248,.18), transparent 66%); animation: d2 22s ease-in-out infinite alternate; }
.o3 { width: 480px; height: 480px; left: 38%; top: 520px;  background: radial-gradient(circle, rgba(99,102,241,.20), transparent 66%); animation: d3 26s ease-in-out infinite alternate; }
@keyframes d1 { to { transform: translate3d(140px, 90px, 0) scale(1.18); } }
@keyframes d2 { to { transform: translate3d(-160px, 70px, 0) scale(.9); } }
@keyframes d3 { to { transform: translate3d(-120px, -90px, 0) scale(1.25); } }

.cursor-glow {
  position: fixed; left: 0; top: 0; width: 560px; height: 560px; margin: -280px 0 0 -280px;
  border-radius: 50%; pointer-events: none; z-index: 0; opacity: 0;
  background: radial-gradient(circle, rgba(77,141,255,.16), rgba(77,141,255,.05) 40%, transparent 68%);
  transition: opacity .6s ease; will-change: transform;
}
.cursor-glow.on { opacity: 1; }
.progress {
  position: fixed; left: 0; top: 0; width: 100%; height: 3px; z-index: 80;
  transform-origin: 0 50%; transform: scaleX(0); pointer-events: none;
  background: linear-gradient(90deg, var(--accent2), #7dd3fc, var(--accent));
  box-shadow: 0 0 12px var(--glow);
}
#app { position: relative; z-index: 1; }

/* =====================================================================
   NAV
   ===================================================================== */
.nav {
  position: fixed; top: 12px; left: 50%; z-index: 70;
  width: min(1040px, calc(100% - 24px));
  translate: -50% 0;
  display: flex; align-items: center; gap: 16px; padding: 10px 12px 10px 14px;
  border-radius: 18px; background: rgba(10,16,34,.74);
  border: 1px solid var(--line);
  -webkit-backdrop-filter: blur(16px) saturate(140%); backdrop-filter: blur(16px) saturate(140%);
  box-shadow: 0 12px 34px rgba(0,0,0,.5);
  transition: translate .55s var(--ease), opacity .4s ease;
  view-transition-name: nav;
}
.nav.hide { translate: -50% -160%; opacity: 0; pointer-events: none; }
.nav-brand { display: flex; align-items: center; gap: 12px; text-decoration: none; }
.nav-brand img, .nav-brand .nb-fb {
  width: 40px; height: 40px; border-radius: 12px; object-fit: cover;
  border: 1px solid var(--line); background: var(--panel2);
  display: grid; place-items: center; color: var(--accent); font: 700 1.2rem var(--display);
}
.nav-brand b { font: 700 1.1rem var(--display); white-space: nowrap; }
.nav-links { display: flex; gap: 2px; margin-left: auto; }
.nav-links a {
  position: relative; padding: 8px 14px; color: var(--mute); text-decoration: none;
  font-weight: 600; font-size: .95rem; transition: color .2s ease;
}
.nav-links a::after {
  content: ""; position: absolute; left: 14px; right: 14px; bottom: 2px; height: 2px; border-radius: 2px;
  background: var(--accent); box-shadow: 0 0 10px var(--glow);
  transform: scaleX(0); transition: transform .4s var(--ease);
}
.nav-links a:hover, .nav-links a.on { color: #fff; }
.nav-links a.on::after, .nav-links a:hover::after { transform: scaleX(1); }
.nav-cta {
  display: inline-flex; align-items: center; padding: 10px 20px; border-radius: 12px; white-space: nowrap;
  background: var(--accent2); color: #fff; text-decoration: none; font-weight: 700; font-size: .92rem;
  transition: background .2s ease, box-shadow .2s ease;
}
.nav-cta:hover { background: var(--accent); box-shadow: 0 6px 20px var(--glow); }

/* =====================================================================
   SHARED PIECES
   ===================================================================== */
.hero {
  text-align: center; padding: 48px 24px 34px;
  background: radial-gradient(760px 340px at 50% 0, rgba(77,141,255,.24), transparent 70%);
}
.hero.small { padding: 28px 24px 24px; }
.profile { max-width: 640px; margin: 0 auto; }
.pfp, .pfp-fallback {
  width: 128px; height: 128px; border-radius: 50%; margin: 0 auto 22px; display: block;
  border: 4px solid var(--bg); box-shadow: 0 0 0 3px var(--accent), 0 0 42px var(--glow);
  animation: floaty 6s ease-in-out infinite;
}
.pfp { object-fit: cover; background: var(--panel); }
.pfp-fallback { display: grid; place-items: center; background: var(--panel2); color: var(--accent); font: 700 3rem var(--display); }
@keyframes floaty { 50% { translate: 0 -7px; } }

h1 { font: 700 clamp(2.6rem, 8vw, 3.8rem)/1 var(--display); letter-spacing: .01em; }
h1#name { text-shadow: 0 0 40px rgba(77,141,255,.35); }
.ch {
  display: inline-block; cursor: default;
  animation: chIn .8s var(--spring) backwards; animation-delay: calc(.2s + var(--i, 0) * 70ms);
  transition: translate .35s var(--spring), rotate .35s var(--spring), color .3s ease;
}
.ch:hover { translate: 0 -8px; rotate: -4deg; color: var(--accent); }
@keyframes chIn { from { opacity: 0; translate: 0 .6em; rotate: 8deg; scale: .7; } }

.tagline {
  margin-top: 14px; font-weight: 700; letter-spacing: .06em;
  background: linear-gradient(90deg, var(--accent), #9fdcff, var(--accent2), var(--accent)) 0 0 / 250% 100%;
  -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: transparent;
  animation: sheen 6s linear infinite;
}
@keyframes sheen { to { background-position: -250% 0; } }
.bio { margin: 22px auto 0; max-width: 46ch; color: var(--mute); line-height: 1.75; }
.bio .bl { display: block; }
.bio .bl + .bl { margin-top: 10px; }
.bio .bl:first-child { color: var(--text); font-weight: 600; font-size: 1.14rem; }

.status {
  display: inline-block; margin-top: 30px; padding: 7px 18px; border-radius: 999px;
  background: rgba(255,255,255,.05); border: 1px solid var(--line); font-weight: 600; font-size: .95rem;
}
.dot { display: inline-block; position: relative; width: 10px; height: 10px; margin-right: 9px; vertical-align: middle; border-radius: 50%; background: #38e07b; box-shadow: 0 0 10px #38e07b; }
.dot.off { background: #ff5a5a; box-shadow: 0 0 10px #ff5a5a; }
.dot::after { content: ""; position: absolute; inset: 0; border-radius: 50%; background: inherit; animation: ping 1.9s var(--ease) infinite; }
@keyframes ping { from { transform: scale(1); opacity: .75; } to { transform: scale(3.4); opacity: 0; } }

.contact {
  display: flex; width: fit-content; margin: 18px auto 0; align-items: center; gap: 12px;
  padding: 8px 8px 8px 20px; border-radius: 999px; background: var(--panel);
  border: 1px solid var(--line); font-size: .95rem; box-shadow: 0 10px 30px rgba(0,0,0,.4);
}
.socials { margin-top: 22px; display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
.copy, .chip {
  border: 1px solid var(--line); cursor: pointer; border-radius: 999px;
  font: 600 .92rem var(--body); text-decoration: none;
}
.copy { border: 0; padding: 9px 18px; background: var(--accent2); color: #fff; }
.copy:hover { background: var(--accent); box-shadow: 0 0 18px var(--glow); }
.chip { display: inline-flex; align-items: center; padding: 9px 20px; background: rgba(255,255,255,.05); color: var(--text); }
.chip:hover { background: var(--accent2); border-color: var(--accent); box-shadow: 0 8px 22px var(--glow); }
.chip.solid { background: var(--accent2); border-color: var(--accent2); }
.chip.solid:hover { background: var(--accent); }
.ico { width: 18px; height: 18px; margin-right: 8px; border-radius: 5px; }

.block { padding: 40px 0 8px; }
.sec {
  text-align: center; font: 600 1.6rem var(--display); margin-bottom: 26px;
}
.sec::after {
  content: ""; display: block; width: 0; height: 3px; margin: 10px auto 0; border-radius: 3px;
  background: var(--accent); box-shadow: 0 0 14px var(--glow); transition: width 1s var(--ease) .3s;
}
.sec.in::after, .lite .sec::after { width: 46px; }
.stage { padding: 20px 0 80px; }
.wrap { max-width: 960px; margin: 0 auto; padding: 0 20px; }
footer { position: relative; z-index: 1; text-align: center; padding: 24px 24px 44px; color: var(--mute); font-size: .85rem; }

/* intro + scroll reveals (translate/opacity only, so they never fight hover transforms) */
.rise { animation: rise .9s var(--ease) backwards; animation-delay: calc(var(--d, 0) * 1ms); }
@keyframes rise { from { opacity: 0; translate: 0 24px; } }
.reveal { opacity: 0; translate: 0 30px; }
.reveal.in {
  opacity: 1; translate: 0 0;
  transition: opacity .85s var(--ease) calc(var(--d, 0) * 1ms), translate .85s var(--ease) calc(var(--d, 0) * 1ms);
}

/* hover FX: spotlight + tilt + magnetic */
.fx { position: relative; }
.fx::before {
  content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; z-index: 3; opacity: 0;
  background: radial-gradient(420px circle at var(--mx, 50%) var(--my, 50%), rgba(140,180,255,.16), transparent 45%);
  transition: opacity .4s ease;
}
.fx:hover::before { opacity: 1; }
.tilt {
  transform: perspective(900px) rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg)) translateY(var(--lift, 0px));
  transition: transform .45s var(--ease), box-shadow .3s ease, border-color .3s ease;
}
.tilt:hover { --lift: -6px; }
.mag {
  transform: translate3d(var(--tx, 0px), calc(var(--ty, 0px) + var(--lift, 0px)), 0);
  transition: transform .35s var(--ease), background .25s ease, box-shadow .25s ease, border-color .25s ease;
}
.mag:hover { --lift: -2px; }
.rip { position: relative; overflow: hidden; }
.ripple { position: absolute; width: 10px; height: 10px; margin: -5px 0 0 -5px; border-radius: 50%; pointer-events: none; background: rgba(255,255,255,.4); transform: scale(0); animation: ripple .7s var(--ease) forwards; }
@keyframes ripple { to { transform: scale(26); opacity: 0; } }
.loading { background: linear-gradient(110deg, #0f1730 30%, #1b2a55 50%, #0f1730 70%) 0 0 / 220% 100%; animation: skel 1.5s linear infinite; }
@keyframes skel { to { background-position: -220% 0; } }

/* =====================================================================
   STYLE CARDS
   ===================================================================== */
.grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
.card {
  display: block; border-radius: var(--r-lg); overflow: hidden; text-decoration: none;
  background: var(--panel); border: 1px solid var(--line); box-shadow: 0 14px 34px rgba(0,0,0,.5);
}
.card:hover { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent), 0 20px 44px var(--glow); }
.cimg { aspect-ratio: 1200 / 663; overflow: hidden; background: var(--bg2); }
.cimg img { width: 100%; height: 100%; object-fit: cover; display: block; opacity: 0; transition: opacity .7s ease, transform .6s var(--ease); }
.cimg img.ready { opacity: 1; }
.card:hover .cimg img { transform: scale(1.06); }
.ph { width: 100%; height: 100%; display: grid; place-content: center; gap: 6px; padding: 20px; text-align: center; background: linear-gradient(135deg, #16316f, #0a1230); }
.ph b { font: 700 1.5rem/1.15 var(--display); }
.ph span { color: var(--mute); font-weight: 500; }
.cbar { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 4px 12px; padding: 12px 16px; }
.cbar b { font: 600 .98rem var(--display); }
.cbar span { color: var(--accent); font-weight: 700; white-space: nowrap; }
.arr { display: inline-block; transition: translate .4s var(--spring); }
.card:hover .arr { translate: 7px 0; }
.card.featured {
  grid-column: 1 / -1; display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr);
  border-color: rgba(77,141,255,.55);
  box-shadow: 0 0 0 1px rgba(77,141,255,.35), 0 22px 54px rgba(77,141,255,.22), 0 14px 34px rgba(0,0,0,.5);
}
.cinfo { padding: 28px; display: flex; flex-direction: column; justify-content: center; align-items: flex-start; gap: 12px; text-align: left; }
.cinfo h3 { font: 700 1.75rem/1.15 var(--display); }
.cinfo p { color: var(--mute); }
.go { display: inline-block; margin-top: 6px; padding: 11px 24px; border-radius: 999px; background: var(--accent2); color: #fff; font-weight: 700; transition: background .25s ease, box-shadow .25s ease; }
.card.featured:hover .go { background: var(--accent); box-shadow: 0 8px 24px var(--glow); }
.more { grid-column: 1 / -1; display: flex; align-items: center; gap: 16px; margin-top: 8px; color: var(--mute); font: 600 1rem var(--display); }
.more::before, .more::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.badge { position: relative; overflow: hidden; display: inline-block; padding: 3px 12px; border-radius: 999px; background: var(--accent2); color: #fff; font-weight: 700; font-size: .8rem; box-shadow: 0 0 16px var(--glow); }
.badge::after { content: ""; position: absolute; inset: 0; transform: translateX(-120%); background: linear-gradient(100deg, transparent 20%, rgba(255,255,255,.5) 50%, transparent 80%); animation: shine 2.8s ease-in-out infinite; }
@keyframes shine { 0%, 55% { transform: translateX(-120%); } 100% { transform: translateX(120%); } }

/* =====================================================================
   VIDEO STRIPS
   ===================================================================== */
.viewport {
  overflow: hidden; padding: 12px 0 18px; cursor: grab; user-select: none; -webkit-user-select: none; touch-action: pan-y;
  -webkit-mask-image: linear-gradient(90deg, transparent, #000 7%, #000 93%, transparent);
          mask-image: linear-gradient(90deg, transparent, #000 7%, #000 93%, transparent);
}
.viewport.dragging { cursor: grabbing; }
.viewport.static { overflow-x: auto; -webkit-mask-image: none; mask-image: none; cursor: auto; }
.viewport.static .dup { display: none; }
.track { display: flex; align-items: stretch; width: max-content; will-change: transform; }
.track img { -webkit-user-drag: none; }
.vid {
  position: relative; flex: 0 0 auto; width: min(420px, 78vw); margin-right: 20px; aspect-ratio: 16 / 9;
  border-radius: 14px; overflow: hidden; cursor: pointer;
  background: var(--panel); border: 1px solid var(--line); box-shadow: 0 12px 30px rgba(0,0,0,.5);
  transition: transform .45s var(--ease), box-shadow .45s ease, border-color .3s ease;
}
.vid:hover { transform: translateY(-5px) scale(1.02); border-color: var(--accent); box-shadow: 0 18px 40px rgba(0,0,0,.55), 0 0 28px rgba(77,141,255,.28); }
.vid.fill { flex: none; width: 100%; margin: 0; }
.vid.big { border-radius: var(--r-md); }
.vid img { width: 100%; height: 100%; object-fit: cover; display: block; opacity: 0; transition: opacity .7s ease; }
.vid img.ready { opacity: 1; }
.vid iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
.play {
  position: absolute; left: 50%; top: 50%; width: 64px; height: 64px; margin: -32px 0 0 -32px; border-radius: 50%;
  background: rgba(6,9,18,.7); border: 2px solid #fff; transition: transform .25s var(--spring), background .2s ease, box-shadow .2s ease;
}
.play::before { content: ""; position: absolute; left: 50%; top: 50%; margin: -10px 0 0 -6px; border-left: 17px solid #fff; border-top: 10px solid transparent; border-bottom: 10px solid transparent; }
.vid:hover .play { transform: scale(1.12); background: var(--accent2); box-shadow: 0 0 24px var(--glow); }
.cap { position: absolute; left: 0; right: 0; bottom: 0; padding: 34px 16px 12px; text-align: left; font-weight: 600; background: linear-gradient(transparent, rgba(6,9,18,.9)); }
.tag { position: absolute; left: 12px; top: 12px; padding: 3px 11px; border-radius: 999px; background: rgba(6,9,18,.78); border: 1px solid var(--line); font-size: .75rem; font-weight: 700; color: var(--accent); }
.resume-row { text-align: center; min-height: 44px; }
.resume { display: none; padding: 10px 22px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line); cursor: pointer; font-weight: 600; }
.resume.show { display: inline-block; }

/* =====================================================================
   REVIEWS
   ===================================================================== */
.summary { text-align: center; margin-bottom: 8px; }
.avg { font: 700 3.6rem/1 var(--display); }
.sd { position: relative; display: inline-flex; margin-top: 8px; }
.sd svg { width: 32px; height: 32px; margin: 0 2px; fill: #26335c; flex: none; }
.sd-fill { position: absolute; left: 0; top: 0; display: flex; overflow: hidden; width: 0; transition: width 1.6s var(--ease); }
.sd-fill svg { fill: var(--gold); filter: drop-shadow(0 0 6px rgba(255,201,77,.45)); }
.summary.in .sd-fill { width: var(--w, 100%); }
.count { margin-top: 6px; color: var(--mute); }
.review {
  flex: 0 0 auto; width: min(380px, 80vw); margin-right: 20px; padding: 20px; border-radius: 18px;
  background: var(--panel); border: 1px solid var(--line); box-shadow: 0 12px 30px rgba(0,0,0,.45);
  display: flex; flex-direction: column; gap: 10px;
}
.review:hover { border-color: var(--accent); }
.review p { white-space: pre-line; overflow-wrap: anywhere; }
.review > img { width: 100%; border-radius: 12px; }
.rhead { display: flex; align-items: center; gap: 12px; }
.avatar { width: 48px; height: 48px; flex: none; border-radius: 50%; object-fit: cover; border: 2px solid var(--accent); box-shadow: 0 0 14px var(--glow); }
.who { font-weight: 700; }
.meta { color: var(--mute); font-size: .85rem; }
.rstars { display: inline-flex; gap: 2px; }
.rstars svg { width: 18px; height: 18px; fill: #26335c; }
.rstars svg.on { fill: var(--gold); animation: twinkle 3.2s ease-in-out infinite; }
.rstars svg:nth-child(2) { animation-delay: .25s; } .rstars svg:nth-child(3) { animation-delay: .5s; }
.rstars svg:nth-child(4) { animation-delay: .75s; } .rstars svg:nth-child(5) { animation-delay: 1s; }
@keyframes twinkle { 50% { filter: drop-shadow(0 0 5px rgba(255,201,77,.8)); scale: 1.12; } }
.reviews-still { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; padding: 12px 20px 18px; }
.reviews-still .review { width: min(560px, 92vw); margin: 0; }
.reviews-still[data-n="3"] .review { width: min(380px, 92vw); }

/* =====================================================================
   PANELS + PRICES (style pages)
   ===================================================================== */
.back { display: inline-flex; align-items: center; gap: 10px; padding: 8px 18px 8px 8px; border-radius: 999px; background: rgba(255,255,255,.05); border: 1px solid var(--line); text-decoration: none; font-weight: 600; font-size: .95rem; }
.back i { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: var(--accent2); color: #fff; font-style: normal; font-size: 1.2rem; font-weight: 700; transition: translate .4s var(--spring); }
.back:hover { background: var(--panel2); border-color: var(--accent); }
.back:hover i { translate: -4px 0; }
.hero.small h1 { margin-top: 26px; font-size: clamp(2rem, 6vw, 3rem); line-height: 1.1; }
.hero.small .bio { margin-top: 12px; }
.panels { max-width: 960px; margin: 0 auto; padding: 0 20px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 24px; }
.panel { min-width: 0; background: var(--panel); border-radius: var(--r-lg); padding: 26px; border: 1px solid var(--line); box-shadow: 0 14px 34px rgba(0,0,0,.45); }
.panel h2 { font: 600 1.4rem var(--display); margin-bottom: 16px; }
.panel .sub { color: var(--mute); margin-bottom: 16px; }
.panel .viewport { padding-bottom: 6px; }
.panel .resume-row { min-height: 0; }
.order { text-align: center; }
.order .socials { margin-top: 6px; }
.soon { text-align: center; color: var(--mute); padding: 20px 0; }
.prices { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 16px; }
.price { padding: 20px; border-radius: var(--r-md); background: var(--panel2); border: 1px solid var(--line); }
.price .badge { margin-bottom: 10px; }

/* =====================================================================
   MARQUEE (auto-scroll, eases to a stop on hover, drag + flick + wheel)
   ===================================================================== */
function marquee(viewport, track, { speed, dir = 1 }) {
  if (reduceMotion) { viewport.classList.add("static"); return { hold() {} }; }
  let off = null, vel = 1, inertia = 0;
  let hover = false, hold = false, visible = true;
  let dragging = false, moved = false, sx = 0, so = 0, lx = 0, lt = 0, dv = 0, touchTimer = 0;

  const io = new IntersectionObserver((e) => { visible = e[0].isIntersecting; });
  io.observe(viewport);

  viewport.addEventListener("mouseenter", () => { hover = true; });
  viewport.addEventListener("mouseleave", () => { hover = false; });
  viewport.addEventListener("touchstart", () => { hover = true; clearTimeout(touchTimer); }, { passive: true });
  viewport.addEventListener("touchend", () => { touchTimer = setTimeout(() => { hover = false; }, 1500); });
  viewport.addEventListener("dragstart", (e) => e.preventDefault());
  viewport.addEventListener("pointerdown", (e) => {
    if (e.pointerType === "mouse" && e.button !== 0) return;
    dragging = true; moved = false; dv = 0; inertia = 0;
    sx = lx = e.clientX; lt = performance.now(); so = off || 0;
  });
  const move = (e) => {
    if (!dragging) return;
    const dx = e.clientX - sx;
    if (Math.abs(dx) > 6) { moved = true; viewport.classList.add("dragging"); }
    if (!moved) return;
    off = so - dx;
    const now = performance.now(), dtm = Math.max(now - lt, 1);
    dv = dv * 0.7 + ((e.clientX - lx) / dtm * 1000) * 0.3;
    lx = e.clientX; lt = now;
  };
  const end = () => {
    if (dragging && moved && performance.now() - lt < 160) inertia = Math.max(-2600, Math.min(2600, -dv));
    dragging = false; viewport.classList.remove("dragging");
  };
  window.addEventListener("pointermove", move);
  window.addEventListener("pointerup", end);
  window.addEventListener("pointercancel", end);
  viewport.addEventListener("click", (e) => { if (moved) { e.stopPropagation(); e.preventDefault(); moved = false; } }, true);
  viewport.addEventListener("wheel", (e) => {
    if (Math.abs(e.deltaX) > Math.abs(e.deltaY)) { e.preventDefault(); if (off !== null) off += e.deltaX; }
  }, { passive: false });

  ticker.add((dt) => {
    if (!viewport.isConnected) {            // page changed: clean up
      io.disconnect();
      window.removeEventListener("pointermove", move);
      window.removeEventListener("pointerup", end);
      window.removeEventListener("pointercancel", end);
      return false;
    }
    if (!visible) return;
    const half = track.scrollWidth / 2;
    if (half <= 0) return;
    if (off === null) off = dir > 0 ? 0 : half;
    const target = (hover || dragging || hold) ? 0 : 1;
    vel += (target - vel) * (1 - Math.exp(-dt * 5));
    if (target === 0 && vel < 0.004) vel = 0;
    if (!dragging) { off += dir * speed * vel * dt + inertia * dt; inertia *= Math.exp(-dt * 3); }
    off = ((off % half) + half) % half;
    track.style.transform = "translate3d(" + (-off) + "px,0,0)";
  });
  return { hold(v) { hold = v; } };
}

/* fill a track with the list twice, so it loops with no gap */
function fillTrack(track, list, build, itemWidth) {
  const repeats = Math.max(1, Math.ceil(2400 / (list.length * itemWidth)));
  const unit = Array.from({ length: repeats }, () => list).flat();
  [false, true].forEach((dup) => unit.forEach((x) => {
    const el = build(x, dup);
    if (dup) { el.classList.add("dup"); el.setAttribute("aria-hidden", "true"); el.setAttribute("inert", ""); }
    track.appendChild(el);
  }));
}

function videoId(input) {
  if (!input) return null;
  const m = String(input).match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?(?:.*&)?v=|shorts\/|embed\/|live\/))([\w-]{11})/);
  return m ? m[1] : /^[\w-]{11}$/.test(input) ? input : null;
}

function video(item, opts = {}) {
  const id = videoId(item.url);
  if (!id) return null;
  const el = h("div", {
    class: "vid loading" + (opts.big ? " big" : "") + (opts.fill ? " fill" : ""),
    role: "button", tabindex: opts.dup ? -1 : 0, "aria-label": "Play " + (item.title || "video")
  },
    h("img", {
      alt: "", loading: "lazy", src: "https://img.youtube.com/vi/" + id + "/hqdefault.jpg",
      onload(e) { e.target.classList.add("ready"); el.classList.remove("loading"); }
    }),
    h("span", { class: "play" }),
    item.tag && h("span", { class: "tag", text: item.tag }),
    item.title && h("div", { class: "cap", text: item.title })
  );
  el._item = item; el._opts = opts;
  const start = () => {
    if (el.dataset.playing) return;
    if (opts.onPlay) opts.onPlay(el);
    el.replaceChildren(h("iframe", {
      src: "https://www.youtube-nocookie.com/embed/" + id + "?autoplay=1&rel=0",
      title: item.title || "YouTube video",
      allow: "autoplay; encrypted-media; picture-in-picture; fullscreen", allowfullscreen: true
    }));
    el.dataset.playing = "1"; el.classList.remove("loading"); el.removeAttribute("role");
  };
  el.addEventListener("click", start);
  el.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); start(); } });
  return el;
}

function videoStrip(list, speed) {
  const track = h("div", { class: "track" });
  const viewport = h("div", { class: "viewport" }, track);
  const resume = h("button", { class: "resume mag rip", type: "button", text: "Resume scrolling" });
  let ctl;
  const resetAll = () => track.querySelectorAll(".vid[data-playing]").forEach((v) => v.replaceWith(video(v._item, v._opts)));
  fillTrack(track, list, (item, dup) => video(item, {
    dup, onPlay() { resetAll(); ctl.hold(true); resume.classList.add("show"); }
  }), 440);
  resume.addEventListener("click", () => { resetAll(); ctl.hold(false); resume.classList.remove("show"); });
  ctl = marquee(viewport, track, { speed, dir: 1 });
  return [viewport, h("div", { class: "resume-row" }, resume)];
}

/* =====================================================================
   ORDER WIZARD (one step at a time)
   ===================================================================== */
function quote(preset) {
  const Q = CONFIG.quote;
  if (!Q || !Q.points || !Q.points.length) return null;
  const styles = Q.styles && Q.styles.length ? Q.styles : ["Roblox"];
  const MIN = Q.minMinutes || 1, MAX = Q.maxMinutes || 22;
  const pts = Q.points.slice().sort((a, b) => a.min - b.min);
  const lengths = Array.from({ length: MAX - MIN + 1 }, (_, i) => MIN + i);

  const priceFor = (m) => {
    if (m <= pts[0].min) return pts[0].price;
    for (let i = 1; i < pts.length; i++) if (m <= pts[i].min) {
      const a = pts[i - 1], b = pts[i];
      return Math.round(a.price + (b.price - a.price) * (m - a.min) / (b.min - a.min));
    }
    return pts[pts.length - 1].price;
  };

  const s = { style: preset ? (styles.find((x) => x.toLowerCase() === String(preset).toLowerCase()) || styles[styles.length - 1]) : null, mins: null, deadline: "" };
  const first = s.style ? 2 : 1;
  let step = first, back = false, stopCount = () => {};
  const root = h("div", { class: "panel fx wz" });

  const go = (n) => { back = n < step; step = n; draw(); };
  const message = () =>
    "Hi " + CONFIG.name + "! I'd like to order a " + s.style + " edit.\n" +
    "Length: about " + s.mins + (s.mins === 1 ? " minute (Short)" : " minutes") + "\n" +
    "Estimated price: $" + priceFor(s.mins) + "\n" +
    "Deadline: " + (s.deadline.trim() || "flexible");

  function choices(values, cur, cls, pick) {
    const g = h("div", { class: cls, role: "group" });
    const btns = values.map((v) => {
      const b = h("button", { class: "opt", type: "button", "aria-pressed": v === cur ? "true" : "false", text: String(v) });
      b.addEventListener("click", () => { btns.forEach((x) => x.setAttribute("aria-pressed", "false")); b.setAttribute("aria-pressed", "true"); pick(v); });
      return b;
    });
    g.append(...btns);
    return g;
  }
  function nav(onBack, label, onNext, enabled) {
    const next = h("button", { class: "q-btn mag rip", type: "button", text: label, disabled: !enabled, onclick: onNext });
    return { next, el: h("div", { class: "wz-nav" }, onBack && h("button", { class: "q-btn ghost mag rip", type: "button", text: "Back", onclick: onBack }), next) };
  }

  function draw() {
    stopCount();
    root.replaceChildren(h("div", { class: "wz-dots" }, [1, 2, 3, 4].map((i) => h("i", { class: i <= step ? "on" : "" }))));
    const box = h("div", { class: "wz-step" + (back ? " back" : "") });
    root.appendChild(box);

    if (step === 1) {
      const n = nav(null, "Next", () => go(2), !!s.style);
      box.append(h("h3", { text: "What style do you want?" }),
        choices(styles, s.style, "opts", (v) => { s.style = v; n.next.disabled = false; }), n.el);
    } else if (step === 2) {
      const n = nav(preset ? null : () => go(1), "Next", () => go(3), s.mins !== null);
      box.append(h("h3", { text: "How long is the video?" }), h("small", { text: "Pick the length in minutes" }),
        choices(lengths, s.mins, "mins", (v) => { s.mins = v; n.next.disabled = false; }), n.el);
    } else if (step === 3) {
      const inp = h("input", { class: "q-input", type: "text", maxlength: 60, placeholder: "e.g. this Friday", "aria-label": "Deadline" });
      inp.value = s.deadline;
      inp.addEventListener("input", () => { s.deadline = inp.value; });
      inp.addEventListener("keydown", (e) => { if (e.key === "Enter") go(4); });
      box.append(h("h3", { text: "When do you need it?" }), h("small", { text: "Optional, you can skip this" }), inp,
        nav(() => go(2), "See my price", () => go(4), true).el);
    } else {
      const price = h("div", { class: "wz-price", text: "$0" });
      const rb = Q.robux;
      const copy = h("button", { class: "q-btn mag rip", type: "button", text: "Copy order message" });
      copy.addEventListener("click", async () => {
        const ok = await copyText(message());
        flash(copy, ok ? "Copied! Paste it in Discord" : "Couldn't copy, select the text", "Copy order message", 2400);
      });
      box.append(
        h("small", { text: "Estimated price" }), price,
        h("div", { class: "wz-sub", text: s.style + " \u00B7 " + s.mins + (s.mins === 1 ? " minute (Short)" : " minute video") }),
        rb && s.mins >= rb.from && s.mins <= rb.to && h("div", { class: "wz-hint", text: rb.text }),
        h("small", { text: Q.note || "This is an estimate. The final price is confirmed in DMs." }),
        h("pre", { class: "q-msg", text: message() }),
        h("div", { class: "q-actions" }, copy, DISCORD_URL !== "#" && h("a", { class: "q-btn ghost mag rip", href: DISCORD_URL, target: "_blank", rel: "noopener noreferrer", text: "Open Discord" })),
        h("div", { class: "wz-nav" },
          h("button", { class: "q-btn ghost mag rip", type: "button", text: "Back", onclick: () => go(3) }),
          h("button", { class: "q-btn ghost mag rip", type: "button", text: "Start over", onclick: () => { s.mins = null; s.deadline = ""; if (!preset) s.style = null; go(first); } })));
      stopCount = countTo(price, 0, priceFor(s.mins), 900, (v) => "$" + Math.round(v));
    }
  }
  draw();
  return reveal(root);
}

function statsRow() {
  const rated = (CONFIG.reviews || []).filter((r) => typeof r.stars === "number");
  const avg = rated.length ? rated.reduce((a, r) => a + r.stars, 0) / rated.length : null;
  const items = (CONFIG.stats || []).filter((s) => !(s.rating && avg === null));
  if (!items.length) return null;

  // Build the row before registering its visibility callback. The previous
  // version referenced `row` from inside its own initializer, causing a
  // "Cannot access 'row' before initialization" error and stopping the page.
  const row = h("div", { class: "stats" });
  const counters = [];

  items.forEach((s, i) => {
    const val = h("b", { text: s.text || "0" });
    const el = h("div", { class: "stat" }, val, h("span", { text: s.label }));

    if (!s.text) {
      const to = s.rating ? avg : Number(s.to) || 0;
      const dec = s.rating ? 1 : 0;
      const fmt = (v) => (s.prefix || "") + v.toFixed(dec) + (s.suffix || "");
      val.textContent = fmt(0);
      counters.push(() => countTo(val, 0, to, 1300, fmt));

    row.appendChild(reveal(el, i * 90));
  });

  if (counters.length) onceVisible(row, () => counters.forEach((start) => start()), 0.4);
  return row;
}

  const panels = [];

  const reel = st.showreel && video(st.showreel, { big: true, fill: true });
  if (reel) panels.push(h("section", { class: "panel fx" }, h("h2", { text: "Showreel" }), reel));

  const works = (st.works || []).filter((w) => videoId(w.url));
  if (works.length >= 2) panels.push(h("section", { class: "panel fx" }, h("h2", { text: "Recent work" }), videoStrip(works, CONFIG.recentSpeed)));
  else if (works.length === 1) panels.push(h("section", { class: "panel fx" }, h("h2", { text: "Recent work" }), video(works[0], { fill: true })));

  if (st.prices && st.prices.length) {
    panels.push(h("section", { class: "panel fx" }, h("h2", { text: "Prices" }), h("div", { class: "prices" }, st.prices.map((pr, i) =>
      reveal(h("div", { class: "price fx tilt" }, pr.badge && h("div", { class: "badge", text: pr.badge }),
        h("h3", { text: pr.name || "" }), h("div", { class: "amt", text: pr.price || "" }), pr.note && h("p", { text: pr.note })), 150 + i * 110)))));
  }
  if (!panels.length) panels.push(h("section", { class: "panel" }, h("p", { class: "soon", text: "Work for this style is coming soon. Check back later!" })));

  const q = quote(st.title.replace(/\s*editing style\s*$/i, ""));
  if (q) panels.push(h("div", {}, h("h2", { class: "q-title", text: "Order your edit" }), q));

  panels.push(h("section", { class: "panel fx order" }, h("h2", { text: "Want an edit like this?" }),
    h("p", { class: "sub", text: "DM me " + CONFIG.discord + " on Discord, or reach me here:" }), h("div", { class: "socials" }, socialButtons(true))));
  panels.forEach((p, i) => { if (!p.classList.contains("reveal")) reveal(p, i * 90); });

  return [
    h("section", { class: "hero small" }, h("div", { class: "profile", style: "max-width:760px" },
      h("a", { class: "back mag rip rise", href: "#" }, h("i", { text: "\u2190" }), "All styles"),
      h("h1", { class: "rise", style: "--d:100", text: st.title }),
      h("p", { class: "bio rise", style: "--d:200", text: st.blurb || "" }))),
    h("main", { class: "stage" }, h("div", { class: "panels" }, panels))
  ];
}

function faqView() {
  const list = h("div", { class: "faq" });
  FAQ.forEach((f, i) => {
    const item = h("div", { class: "fq rise", style: "--d:" + (300 + i * 80) });
    const btn = h("button", { type: "button", "aria-expanded": "false" }, h("span", { text: f.q }), h("span", { class: "pl" }));
    btn.addEventListener("click", () => {
      const open = !item.classList.contains("open");
      list.querySelectorAll(".fq.open").forEach((x) => { x.classList.remove("open"); $("button", x).setAttribute("aria-expanded", "false"); });
      if (open) { item.classList.add("open"); btn.setAttribute("aria-expanded", "true"); }
    });
    item.append(btn, h("div", { class: "fa" }, h("div", {}, h("p", { text: f.a }))));
    list.appendChild(item);
  });
  return [
    h("section", { class: "st-hero" }, h("h1", { class: "st-title" }, h("span", { class: "t1 rise", text: "FAQ" })),
      h("p", { class: "st-sub rise", style: "--d:200", text: "Quick answers before you order." })),
    h("main", { class: "stage" }, list)
  ];
}

function storeView() {
  const allClosed = STORE.every((s) => s.closed);
  const grid = h("div", { class: "st-grid" });
  STORE.forEach((it, n) => {
    const flat = it.name.replace(/\n/g, " ");
    const parts = String(it.price).split(".");
    let buy;
    if (it.closed) buy = h("span", { class: "st-buy closed", role: "button", "aria-disabled": "true", text: "Closed" });
    else {
      buy = h("a", { class: "st-buy", href: it.link || DISCORD_URL, target: "_blank", rel: "noopener noreferrer", text: "Buy now" });
      if (!it.link) buy.addEventListener("click", async () => {
        if (await copyText("Hi " + CONFIG.name + "! I'd like to buy the " + flat + " (" + it.price + ").")) flash(buy, "Copied! Paste it in Discord", "Buy now", 2400);
      });
    }
    grid.appendChild(h("div", { class: "st-card rise" + (it.closed ? " is-closed" : ""), style: "--d:" + (350 + n * 150) },
      h("div", { class: "st-ico" }, (it.images || [it.image]).map((src, k) => h("img", { alt: "", src, style: "animation-delay:" + k * 0.7 + "s" }))),
      h("h3", { text: it.name }), it.desc && h("p", { class: "st-desc", text: it.desc }),
      it.includes && it.includes.length && h("ul", { class: "st-inc" }, it.includes.map((t) => h("li", { text: t }))),
      h("div", { class: "st-price" }, parts[0], parts[1] && h("small", { text: "." + parts[1] })), buy));
  });
  return [
    h("section", { class: "st-hero" }, h("h1", { class: "st-title" }, h("span", { class: "t1 rise", text: "Editing" }), h("span", { class: "t2 rise", style: "--d:140", text: "Store" })),
      h("p", { class: "st-sub rise", style: "--d:300", text: "Products designed to improve your editing." })),
    h("div", { class: "st-wrap" }, grid, h("p", { class: "st-note rise", style: "--d:700",
      text: allClosed ? "The store is closed right now. Join my Discord to hear when it opens." : "Buying through Discord: click Buy now, paste the message, and I'll send it over." }))
  ];
}

/* =====================================================================
   NAV + ROUTER
   ===================================================================== */
const nav = $("#nav");
(function buildNav() {
  const pfp = h("span", {});
  const img = h("img", { alt: "", src: CONFIG.pfp });
  img.onload = () => pfp.appendChild(img);
  img.onerror = () => pfp.appendChild(h("span", { class: "nb-fb", text: CONFIG.name.charAt(0).toUpperCase() }));
  nav.append(
    h("a", { class: "nav-brand", href: "#" }, pfp, h("b", { text: CONFIG.name + " Editing" })),
    h("div", { class: "nav-links" }, [
      { n: "Home", h: "#", k: "" }, { n: "Styles", h: "#styles", k: "styles" }, { n: "FAQ", h: "#faq", k: "faq" },
      { n: "Store", h: "#store", k: "store" }, { n: "Discord", h: DISCORD_URL, ext: true }
    ].map((l) => h("a", { href: l.h, "data-k": l.k, target: l.ext ? "_blank" : null, rel: l.ext ? "noopener noreferrer" : null, text: l.n }))),
    h("a", { class: "nav-cta", href: DISCORD_URL, target: "_blank", rel: "noopener noreferrer", text: "Join Discord" }));

  let lastY = scrollY;
  addEventListener("scroll", () => {
    const y = scrollY;
    if (y <= 80 || y < lastY - 2) nav.classList.remove("hide");
    else if (y > lastY + 2) nav.classList.add("hide");
    lastY = y;
  }, { passive: true });
})();

const app = $("#app");
function route(first) {
  const id = decodeURIComponent(location.hash.replace(/^#\/?/, ""));
  const st = CONFIG.styles.find((s) => s.id === id);
  let view, title, key = "";
  if (id === "store") { view = storeView; title = "Store"; key = "store"; }
  else if (id === "faq") { view = faqView; title = "FAQ"; key = "faq"; }
  else if (id === "styles") { view = stylesView; title = "Editing styles"; key = "styles"; }
  else if (st) { view = () => styleView(st); title = st.title; key = "styles"; }
  else { view = homeView; title = CONFIG.name + " | " + CONFIG.tagline; }

  const swap = () => {
    app.replaceChildren(...[].concat(view()).filter(Boolean));
    document.title = st || id ? title + " | " + CONFIG.name : title;
    scrollTo({ top: 0, behavior: "instant" });
    nav.classList.remove("hide");
    nav.querySelectorAll("a[data-k]").forEach((a) => a.classList.toggle("on", a.dataset.k === key));
  };
  if (!first && FX && document.startViewTransition) document.startViewTransition(swap); else swap();
}
addEventListener("hashchange", () => route(false));
$("#foot").append(
  h("div", { class: "foot-links" },
    [["Home", "#"], ["Styles", "#styles"], ["FAQ", "#faq"], ["Store", "#store"]].map(([n, href]) => h("a", { href, text: n })),
    h("a", { href: DISCORD_URL, target: "_blank", rel: "noopener noreferrer", text: "Discord" })),
  h("div", { text: "\u00A9 " + new Date().getFullYear() + " " + CONFIG.name }));

/* back to top */
(function toTop() {
  const b = h("button", { class: "totop", type: "button", "aria-label": "Back to top", text: "\u2191" });
  b.addEventListener("click", () => scrollTo({ top: 0, behavior: "smooth" }));
  document.body.appendChild(b);
  addEventListener("scroll", () => b.classList.toggle("show", scrollY > 700), { passive: true });
})();

route(true);

/* =====================================================================
   AMBIENT MOTION + INTERACTIONS
   ===================================================================== */
(function ambient() {
  if (!FX) return;
  const bar = $("#progress"), glow = $("#cursorGlow"), par = $("#bgPar");
  let tx = innerWidth / 2, ty = innerHeight / 2, gx = tx, gy = ty, px = 0, py = 0, lastP = -1;

  if (HOVER) {
    addEventListener("pointermove", (e) => { if (e.pointerType !== "touch") { tx = e.clientX; ty = e.clientY; glow.classList.add("on"); } }, { passive: true });
    document.documentElement.addEventListener("mouseleave", () => glow.classList.remove("on"));
  }
  ticker.add(() => {
    const max = document.documentElement.scrollHeight - innerHeight;
    const p = max > 0 ? Math.min(Math.max(scrollY / max, 0), 1) : 0;
    if (p !== lastP) { bar.style.transform = "scaleX(" + p + ")"; lastP = p; }
    if (HOVER) {
      gx += (tx - gx) * 0.14; gy += (ty - gy) * 0.14;
      glow.style.transform = "translate3d(" + gx + "px," + gy + "px,0)";
      px += ((tx / innerWidth - 0.5) - px) * 0.06; py += ((ty / innerHeight - 0.5) - py) * 0.06;
      par.style.translate = (-px * 26) + "px " + (-py * 18) + "px";
    }
  });
})();

(function interactions() {
  document.addEventListener("click", (e) => {
    const r = FX && e.target.closest && e.target.closest(".rip");
    if (!r) return;
    const b = r.getBoundingClientRect();
    const s = h("span", { class: "ripple", style: "left:" + (e.clientX - b.left) + "px;top:" + (e.clientY - b.top) + "px" });
    r.appendChild(s);
    setTimeout(() => s.remove(), 750);
  });
  if (!FX || !HOVER) return;

  let curFx = null, curMag = null, ev = null, queued = false;
  const reset = (el, ...props) => el && props.forEach((p) => el.style.setProperty(p, "0")) ;
  function apply() {
    queued = false;
    if (!ev) return;
    const t = ev.target && ev.target.closest ? ev.target : document.body;
    const fx = t.closest(".fx");
    if (curFx && curFx !== fx) { curFx.style.setProperty("--rx", "0deg"); curFx.style.setProperty("--ry", "0deg"); }
    curFx = fx;
    if (fx) {
      const b = fx.getBoundingClientRect(), x = ev.clientX - b.left, y = ev.clientY - b.top;
      fx.style.setProperty("--mx", x + "px"); fx.style.setProperty("--my", y + "px");
      if (fx.classList.contains("tilt")) {
        fx.style.setProperty("--ry", ((x / b.width - 0.5) * 8) + "deg");
        fx.style.setProperty("--rx", (-(y / b.height - 0.5) * 6) + "deg");
      }
    }
    const mg = t.closest(".mag");
    if (curMag && curMag !== mg) { curMag.style.setProperty("--tx", "0px"); curMag.style.setProperty("--ty", "0px"); }
    curMag = mg;
    if (mg) {
      const b = mg.getBoundingClientRect();
      mg.style.setProperty("--tx", ((ev.clientX - (b.left + b.width / 2)) * 0.2) + "px");
      mg.style.setProperty("--ty", ((ev.clientY - (b.top + b.height / 2)) * 0.28) + "px");
    }
  }
  document.addEventListener("pointermove", (e) => {
    if (e.pointerType === "touch") return;
    ev = e;
    if (!queued) { queued = true; requestAnimationFrame(apply); }
  }, { passive: true });
  document.documentElement.addEventListener("mouseleave", () => { ev = { target: document.body, clientX: 0, clientY: 0 }; apply(); });
})();
</script>
</body>
